services:
  database:
    image: mysql:8.0
    container_name: loan-mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: cloudpassword
      MYSQL_DATABASE: loan_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcloudpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  telemetry-api:
    build: .
    container_name: local-telemetry-engine
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
